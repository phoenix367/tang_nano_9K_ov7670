name: lint

# Ruff lints the Python tooling (webapp/ + scripts/); ESLint lints the web app's
# browser JavaScript (webapp/static/). Both run on a stock runner, no hardware.

on:
  push:
    paths:
      - '**.py'
      - 'ruff.toml'
      - 'webapp/static/**'
      - 'webapp/package.json'
      - 'webapp/package-lock.json'
      - 'webapp/eslint.config.mjs'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - '**.py'
      - 'ruff.toml'
      - 'webapp/static/**'
      - 'webapp/package.json'
      - 'webapp/package-lock.json'
      - 'webapp/eslint.config.mjs'
      - '.github/workflows/lint.yml'

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .

  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install dependencies
        working-directory: webapp
        run: npm ci
      - name: ESLint
        working-directory: webapp
        run: npm run lint
