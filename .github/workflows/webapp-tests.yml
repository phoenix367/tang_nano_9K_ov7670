name: webapp tests

# The web app's pytest suite runs without hardware: a fake in-memory Modbus
# slave (webapp/tests/fake_modbus.py) stands in for the FPGA, so the real
# ModbusRTU client and the Flask routes are exercised end-to-end.

on:
  push:
    paths:
      - 'webapp/**'
      - '.github/workflows/webapp-tests.yml'
  pull_request:
    paths:
      - 'webapp/**'
      - '.github/workflows/webapp-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: webapp/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r webapp/requirements-dev.txt

      - name: Run tests
        working-directory: webapp
        run: python -m pytest tests -q
